# Lokale ontwikkelomgeving: PostgreSQL en Azurite (nagebootste Azure Blob Storage voor uploads, vanaf blok 1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: homebase
      POSTGRES_DB: homebase
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    ports: ["10000:10000"]
volumes:
  db-data:
