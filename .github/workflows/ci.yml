name: Controle

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests en build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exitnotion
          POSTGRES_PASSWORD: exitnotion
          POSTGRES_DB: exitnotion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exitnotion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://exitnotion:exitnotion@localhost:5432/exitnotion_test
      # Alleen nodig zodat de build de databasemodule kan laden; er wordt geen verbinding gemaakt.
      DATABASE_URL: postgres://exitnotion:exitnotion@localhost:5432/exitnotion_test
      AUTH_SECRET: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
