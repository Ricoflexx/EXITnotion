<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 800 800" role="img" aria-label="Homebase" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Homebase</title>
  <style>
    .p { transform-box: fill-box; animation-fill-mode: both; animation-duration: .5s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }

    /* 1. linker stok groeit omhoog */
    .stem-l  { transform-origin: 50% 100%; animation-name: growY; animation-delay: .1s; }
    /* 2. brug trekt naar rechts */
    .bridge  { transform-origin: 0% 50%;   animation-name: growX; animation-delay: .4s; animation-duration: .4s; }
    /* 3. rechter stok groeit omhoog */
    .stem-r  { transform-origin: 50% 100%; animation-name: growY; animation-delay: .6s; }
    /* 4. buikje rolt uit de stok */
    .bowl    { transform-origin: 0% 100%;  animation-name: pop;   animation-delay: .95s; animation-duration: .55s;
               animation-timing-function: cubic-bezier(.34,1.45,.64,1); }
    /* 5. huisje komt omhoog uit de basislijn */
    .house   { animation-name: rise;  animation-delay: 1.35s; animation-duration: .6s; }
    /* 6. schoorsteen en deur als laatste */
    .chimney { animation-name: chim;  animation-delay: 1.85s; animation-duration: .3s; }
    .door    { transform-origin: 50% 100%; animation-name: growY; animation-delay: 1.95s; animation-duration: .3s; }

    @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pop   { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes rise  { from { transform: translateY(260px); } to { transform: translateY(0); } }
    @keyframes chim  { from { transform: translateY(60px); } to { transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .p { animation: none; }
    }
  </style>

  <defs>
    <mask id="hb-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="800">
      <rect x="0" y="0" width="880" height="800" fill="#fff"/>
      <g class="p house">
        <path d="M290 440 L418 556 L398 578 L360 544 V780 H220 V544 L182 578 L162 556 Z" fill="#000"/>
      </g>
      <rect class="p chimney" x="330" y="452" width="32" height="60" fill="#000"/>
      <path d="M500 480 C530 465 560 460 590 460 C640 460 660 500 660 550 C660 610 635 645 590 645 C560 645 530 640 500 630 Z" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#hb-cut)" fill="#000">
    <rect class="p stem-l" x="80" y="20" width="140" height="760"/>
    <path class="p bridge" d="M200 340 C250 290 310 262 380 258 V600 H200 Z"/>
    <rect class="p stem-r" x="360" y="20" width="140" height="760"/>
    <path class="p bowl" d="M480 430 C530 360 590 320 650 320 C745 320 800 410 800 550 C800 700 740 780 640 780 H480 Z"/>
  </g>
  <rect class="p door" x="270" y="700" width="44" height="80" fill="#000"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
